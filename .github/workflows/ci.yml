# CI: the contract's `verify` chain (docs/CONTRACT.md) on every pull request and every push to main. A green run on a
# push to main is what deploy-pages.yml / deploy-workers.yml wait for. Until Step C lands the scripts these steps call
# (docs/TODO-step-c.md), this workflow fails: that's expected.
# Security (.github/README.md): actions pinned to full commit SHAs; read-only token; no secrets; never
# pull_request_target; install scripts blocked by .npmrc (ignore-scripts=true).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json # engines.node
          cache: npm

      - name: Install (lockfile only; install scripts blocked by .npmrc)
        run: npm ci

      - name: Repo checks (secrets, .env files, placeholders)
        run: npm run check:repo

      - name: Vulnerability gate (high and critical)
        run: npm run audit

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build (static export, then check-out)
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  workflow-helpers:
    name: workflow helpers self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Planted cases for target-url, preview-url and zap-gate (no dependencies)
        run: node .github/scripts/selftest.mjs
